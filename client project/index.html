<style>
/* Layout: sticky header with language switch, cart and wishlist; hero; filterable collection; offers; reels; about; contact; legal pages. Admin is a separate view at #admin. One committed look: light champagne gold. */
:root{

  color-scheme:light;
}
html[data-lang=hi]{--f-head:'Tiro Devanagari Hindi',Georgia,serif;--f-body:'Mukta','Jost',system-ui,sans-serif;--f-script:'Tiro Devanagari Hindi',Georgia,serif}

html[data-lang=hi] h1,html[data-lang=hi] h2,html[data-lang=hi] h3,html[data-lang=bho] h1,html[data-lang=bho] h2,html[data-lang=bho] h3{line-height:1.3!important}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);margin:0;min-height:100vh;
  background-image:radial-gradient(circle at 15% 0%,var(--champ),transparent 40%),radial-gradient(circle at 100% 30%,var(--champ),transparent 35%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gold-text{background:linear-gradient(100deg,var(--gold-deep),var(--gold) 45%,var(--gold-deep) 75%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold-deep);background-size:220% 100%}
.shimmer{animation:shine 2.4s ease-out 1}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.shimmer{animation:none}html{scroll-behavior:auto}*{transition:none!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold-deep);border-radius:999px;padding:11px 22px;font-weight:500;letter-spacing:.02em;text-decoration:none;color:var(--ink);background:linear-gradient(135deg,var(--gold-light),var(--gold) 55%,var(--gold-deep));box-shadow:0 6px 18px -8px var(--gold-deep);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--gold-deep)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;box-shadow:0 6px 18px -8px var(--wa)}
.btn.sm{padding:8px 16px;font-size:14px}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger);box-shadow:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.topbar{background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-deep));color:#fff8e6;text-align:center;font-size:14px;padding:7px 0}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}

.tools{display:flex;align-items:center;gap:8px}

.ph{display:grid;place-items:center;text-align:center;color:var(--gold-deep);background-image:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.22) 14px 15px),repeating-linear-gradient(-45deg,transparent 0 14px,rgba(255,255,255,.22) 14px 15px),linear-gradient(160deg,var(--a,#F6E7BE),var(--b,#E3C77A))}

function filtered(){
  var q=F.q.trim().toLowerCase();
  var l=S.products.filter(function(p){
    if(F.cat!=='All'&&p.cat!==F.cat)return false;
    if(q&&(p.name+' '+(p.nameHi||'')+' '+p.cat+' '+(p.desc||'')).toLowerCase().indexOf(q)<0)return false;
    if(F.price){var r=F.price.split('-');if(p.price<Number(r[0])||p.price>Number(r[1]))return false}
    if(F.size&&(p.sizes||[]).indexOf(F.size)<0)return false;
    if(F.stock&&soldOut(p))return false;
    return true});
  if(F.sort==='lo')l.sort(function(a,b){return a.price-b.price});
  if(F.sort==='hi')l.sort(function(a,b){return b.price-a.price});
  if(F.sort==='rate')l.sort(function(a,b){var x=ratingOf(a.id),y=ratingOf(b.id);return y.avg-x.avg||y.n-x.n});
  if(F.sort==='off')l.sort(function(a,b){return ((b.old>b.price)?(b.old-b.price)/b.old:0)-((a.old>a.price)?(a.old-a.price)/a.old:0)});
  return l;
}

function fill(t){var s=S.settings;return t.replace(/\{phone\}/g,s.phone).replace(/\{days\}/g,s.returnDays).replace(/\{fee\}/g,s.deliveryFee).replace(/\{free\}/g,s.freeAbove).replace(/\{dd\}/g,s.deliveryDays).replace(/\{area\}/g,s.area)}

/* ---------- cart and orders ---------- */
function keyOf(pid,size){return pid+'~'+encodeURIComponent(size||'')}
function cartLines(){return cust.cart.map(function(c){var p=prod(c.pid);return p?{p:p,size:c.size||'',qty:c.qty,line:p.price*c.qty,key:keyOf(c.pid,c.size)}:null}).filter(Boolean)}
function totals(lines,pick){
  var sub=lines.reduce(function(a,l){return a+l.line},0),disc=ui.coupon?Math.round(sub*ui.coupon.percent/100):0,net=sub-disc,fa=Number(S.settings.freeAbove||0);
  var fee=(pick||!lines.length||(fa>0&&net>=fa))?0:Number(S.settings.deliveryFee||0);
  return {sub:sub,disc:disc,fee:fee,total:net+fee};
}
function addToCart(pid,size,qty){
  var p=prod(pid);if(!p||soldOut(p))return false;
  var c=cust.cart.filter(function(x){return x.pid===pid&&(x.size||'')===(size||'')})[0];
  var cur=cust.cart.filter(function(x){return x.pid===pid}).reduce(function(a,x){return a+x.qty},0);
  if(cur+(qty||1)>stockMax(p)){toast(tr('only_left',stockMax(p)));return false}
  if(c)c.qty+=qty||1;else cust.cart.push({pid:pid,size:size||'',qty:qty||1});
  saveC();updateBadges();return true;
}
function applyCoupon(){
  var code=(ui.form.coupon||'').trim().toUpperCase();if(!code)return;
  var o=activeOffers().filter(function(x){return x.code&&x.code.toUpperCase()===code&&Number(x.percent)>0})[0];
  if(o){ui.coupon={code:o.code,percent:Number(o.percent)};toast(tr('coupon_ok',o.percent))}else{ui.coupon=null;toast(tr('coupon_bad'))}
  renderLayer();
}
function newOrderId(){var d=new Date();return 'QF'+String(d.getFullYear()).slice(2)+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'-'+Math.floor(1000+Math.random()*9000)}
function payMethods(pick){var m=['upi'];if(pick)m.push('store');else if(S.settings.codOn)m.push('cod');return m}
function placeOrder(){
  var f=ui.form,lines=cartLines(),pick=f.deliv==='pickup';
  if(!lines.length){toast(tr('cart_empty'));return}
  var phone=(f.phone||'').replace(/\D/g,'').slice(-10);
  if(!(f.name||'').trim()||(!pick&&(!(f.addr||'').trim()||!(f.city||'').trim()))){toast(tr('co_err'));return}
  if(phone.length!==10){toast(tr('co_err_phone'));return}
  if(!pick&&!/^\d{6}$/.test((f.pin||'').trim())){toast(tr('co_err_pin'));return}
  for(var i=0;i<lines.length;i++){var l=lines[i];if(soldOut(l.p)||l.qty>stockMax(l.p)){toast(tr('co_err_stock'));return}}
  var methods=payMethods(pick),pay=methods.indexOf(f.pay)>-1?f.pay:methods[0],t=totals(lines,pick),now=new Date().toISOString();
  var o={id:newOrderId(),created:now,status:'placed',deliv:pick?'pickup':'home',
    items:lines.map(function(l){return {pid:l.p.id,name:l.p.name,price:l.p.price,qty:l.qty,size:l.size}}),
    customer:{name:f.name.trim(),phone:phone,addr:(f.addr||'').trim(),city:(f.city||'').trim(),pin:(f.pin||'').trim(),note:(f.note||'').trim()},
    pay:{method:pay,status:'pending',ref:(f.ref||'').trim()},sub:t.sub,disc:t.disc,fee:t.fee,total:t.total,coupon:ui.coupon?ui.coupon.code:'',lang:cust.lang,history:[{s:'placed',at:now}]};
  lines.forEach(function(l){if(l.p.stock!==''&&l.p.stock!=null)l.p.stock=Math.max(0,Number(l.p.stock)-l.qty)});
  S.orders.unshift(o);
  if(!save()){S.orders.shift();return}
  cust.cart=[];cust.orders.unshift(o.id);saveC();ui.coupon=null;ui.form={};ui.drawer=null;ui.modal={t:'thanks',id:o.id};
  updateBadges();renderGrid();renderLayer();
}
function orderWAText(o){
  return 'New order '+o.id+'\n'+o.customer.name+' ('+o.customer.phone+')\n'+o.items.map(function(i){return '- '+i.name+(i.size?' ['+i.size+']':'')+' x'+i.qty+' = '+money(i.price*i.qty)}).join('\n')+
  '\nTotal: '+money(o.total)+'\nPayment: '+o.pay.method.toUpperCase()+(o.pay.ref?' (ref '+o.pay.ref+')':'')+'\n'+(o.deliv==='pickup'?'Store pickup':'Deliver to: '+o.customer.addr+', '+o.customer.city+' '+o.customer.pin)+(o.customer.note?'\nNote: '+o.customer.note:'');
}
function stLabel(s,o){if(s==='shipped')return tr(o&&o.deliv==='pickup'?'st_ready':'st_out');return tr('st_'+s)}
function payLabel(o){return tr('pay_'+(o.pay.status==='refund_due'?'refund_due':o.pay.status))}
function restock(o){if(o.restocked)return;o.items.forEach(function(i){var p=prod(i.pid);if(p&&p.stock!==''&&p.stock!=null)p.stock=Number(p.stock)+i.qty});o.restocked=true}
function cancelOrder(id,reason,by){
  var o=S.orders.filter(function(x){return x.id===id})[0];if(!o||o.status==='cancelled'||o.status==='delivered')return false;
  o.status='cancelled';o.cancel={reason:reason||'',by:by,at:new Date().toISOString()};o.history.push({s:'cancelled',at:o.cancel.at,note:reason});
  o.pay.status=o.pay.status==='paid'?'refund_due':'void';restock(o);return save();
}
function timeline(o){
  if(o.status==='cancelled')return '<p><span class="pill red">'+tr('st_cancelled')+'</span> '+(o.cancel&&o.cancel.reason?tr('tr_reason',esc(o.cancel.reason)):'')+'</p>';
  var steps=['placed','confirmed','packed','shipped','delivered'],idx=steps.indexOf(o.status);
  return '<ol class="tl">'+steps.map(function(s,i){return '<li class="'+(i<=idx?'on':'')+'"><i></i>'+stLabel(s,o)+'</li>'}).join('')+'</ol>';
}
function summaryRows(t,pick){return '<div class="sum"><span>'+tr('subtotal')+'</span><span>'+money(t.sub)+'</span></div>'+(t.disc?'<div class="sum"><span>'+tr('discount')+'</span><span>-'+money(t.disc)+'</span></div>':'')+'<div class="sum"><span>'+tr('delivery')+'</span><span>'+(t.fee?money(t.fee):tr('free'))+'</span></div><div class="sum tot"><span>'+tr('total')+'</span><span>'+money(t.total)+'</span></div>'}

function wishDrawer(){

  if(c){var l=ps.filter(function(p){return p.cat===c}).slice(0,5);return l.length?tr('bot_cat',esc(catName(c)))+plines(l)+tr('bot_tap'):tr('bot_cat_none',esc(catName(c)))}

  if(/new|naya|naye|arrival|latest|collection|नया|नई|कलेक्शन/.test(t))return tr('bot_new')+plines(ps.slice(0,5))+tr('bot_tap');

  if(/thank|shukriya|dhanyavad|धन्यवाद|शुक्रिया/.test(t))return tr('bot_thanks');
  return tr('bot_fallback')+'<br><a target="_blank" rel="noopener" href="'+waLink('Hello! '+raw)+'" style="color:var(--gold-deep);font-weight:500">WhatsApp</a>';

  '<div class="panel"><h3>Categories</h3><div class="sw" style="margin-bottom:12px">'+S.categories.map(function(c,i){return '<span class="pill" style="font-size:14px;padding:6px 14px;margin:0">'+esc(c)+' <button class="linkbtn" data-delcat="'+i+'" aria-label="'+esc(c)+' hatayein">&times;</button></span>'}).join('')+'</div><form id="cform" class="actions" style="margin:0"><input id="c-new" placeholder="Nayi category" style="border:1px solid var(--line);border-radius:999px;padding:10px 16px;font:inherit;min-width:0;flex:1;max-width:260px" aria-label="Nayi category"><button class="btn sm">Jodein</button></form></div>';
}
function adminLook(){
  var cols=[['#C9A24B','Sunehra'],['#C98F7A','Rose gold'],['#BFA77A','Champagne'],['#B08A3E','Purana sona'],['#D4AF37','Chamakdar sona']];
  return '<div class="panel"><h3>Rang</h3><p class="note">Poori website ka sunehra rang yahan se badlein.</p><div class="sw">'+cols.map(function(c){return '<button style="background:'+c[0]+'" data-col="'+c[0]+'" aria-pressed="'+(S.accent.toLowerCase()===c[0].toLowerCase())+'" aria-label="'+c[1]+'" title="'+c[1]+'"></button>'}).join('')+'<label class="f" style="flex-direction:row;align-items:center;gap:10px" for="col-custom">Apna rang <input id="col-custom" type="color" value="'+S.accent+'" style="width:48px;height:40px;padding:2px;border-radius:8px"></label></div></div>'+
  '<div class="panel"><h3>Logo</h3><p class="note">Apna logo upload karein. Na ho to taaj wala nishan dikhega.</p><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="width:72px;height:72px">'+logoHTML().replace('<img','<img style="width:72px;height:72px;object-fit:contain"')+'</div><label class="f" for="logo-file" style="flex:1;min-width:200px"><input id="logo-file" type="file" accept="image/*"></label>'+(S.logo?'<button class="btn sm danger" data-rmlogo>Logo hatayein</button>':'')+'</div></div>'+
  '<div class="panel"><h3>PIN badlein</h3><form id="pinform"><div class="fgrid">'+sfield('pin-new','Naya PIN (kam se kam 4 ank)','','password','inputmode="numeric" minlength="4" required autocomplete="new-password"')+'</div><div class="actions"><button class="btn">PIN badlein</button></div></form></div>';
}
function adminBackup(){
  return '<div class="panel"><h3>Backup</h3><p class="note">Ye data aapke is browser mein save hota hai. Phone badalne ya browser saaf karne se pehle backup copy karke rakhein.</p><label class="f" for="bk-out">Data<textarea id="bk-out" class="mono" readonly>'+esc(JSON.stringify(S))+'</textarea></label><div class="actions"><button class="btn sm" data-copybk>Copy karein</button></div></div>'+
  '<div class="panel"><h3>Backup wapas lagayein</h3><label class="f" for="bk-in">Pehle copy kiya hua data paste karein<textarea id="bk-in" class="mono"></textarea></label><div class="actions"><button class="btn sm" data-restore>Wapas lagayein</button><button class="btn sm danger" data-reset>Demo par wapas jayein</button></div></div>';
}
function arm(id,fn){if(confirmId===id){confirmId=null;fn()}else{confirmId=id;clearTimeout(confirmT);confirmT=setTimeout(function(){confirmId=null;if(route()==='admin')renderAdmin()},4000)}renderAdmin()}
function openForm(id){editing=id;if(id==='new')draft={name:'',nameHi:'',cat:S.categories[0]||'',price:'',old:'',badge:'',stock:'',sizes:'',desc:'',descHi:'',img:''};else{var p=prod(id);draft=Object.assign({},p,{sizes:(p.sizes||[]).join(', '),old:p.old||''})}renderAdmin();window.scrollTo(0,0)}
document.addEventListener('click',function(e){
  if(route()!=='admin')return;var t=e.target,x;
  if(t.closest('[data-home]')){location.hash='';return}
  if(t.closest('[data-logout]')){authed=false;renderAdmin();return}
  if(x=t.closest('[data-tab]')){tab=x.getAttribute('data-tab');editing=null;renderAdmin();return}
  if(x=t.closest('[data-ofilter]')){adm.of=x.getAttribute('data-ofilter');renderAdmin();return}
  if(x=t.closest('[data-ostep]')){var o=S.orders.filter(function(o){return o.id===x.getAttribute('data-ostep')})[0];if(o&&NEXT[o.status]){o.status=NEXT[o.status];o.history.push({s:o.status,at:new Date().toISOString()});if(o.status==='delivered'&&o.pay.status==='pending'&&o.pay.method!=='upi')o.pay.status='paid';save();toast('Order: '+aLabel(o.status,o))}renderAdmin();return}
  if(x=t.closest('[data-opay]')){var a=x.getAttribute('data-opay').split(':'),o2=S.orders.filter(function(o){return o.id===a[0]})[0];if(o2){o2.pay.status=a[1];save();toast('Payment update ho gaya')}renderAdmin();return}
  if(x=t.closest('[data-ocopen]')){adm.cancelFor=x.getAttribute('data-ocopen');adm.cancelReason=REASONS[0];adm.cancelText='';renderAdmin();return}
  if(t.closest('[data-ocback]')){adm.cancelFor=null;renderAdmin();return}
  if(x=t.closest('[data-ocdo]')){var why=adm.cancelReason+(adm.cancelText?': '+adm.cancelText:'');if(cancelOrder(x.getAttribute('data-ocdo'),why,'shop'))toast('Order cancel ho gaya');adm.cancelFor=null;renderAdmin();return}
  if(t.closest('[data-newp]')){openForm('new');return}
  if(x=t.closest('[data-editp]')){openForm(x.getAttribute('data-editp'));return}
  if(t.closest('[data-cancel]')){editing=null;renderAdmin();return}
  if(t.closest('[data-rmimg]')){draft.img='';renderAdmin();return}
  if(x=t.closest('[data-togp]')){var b=x.getAttribute('data-togp').split(':'),p=prod(b[1]);if(p){p[b[0]]=!p[b[0]];if(b[0]==='featured'&&p.featured)S.products.forEach(function(q){if(q!==p)q.featured=false});save();renderAdmin()}return}
  if(x=t.closest('[data-delp]')){var id=x.getAttribute('data-delp');arm('p'+id,function(){S.products=S.products.filter(function(p){return p.id!==id});cust.wish=cust.wish.filter(function(w){return w!==id});save();toast('Product delete ho gaya')});return}
  if(t.closest('[data-cleardemo]')){S.products=S.products.filter(function(p){return !p.sample});S.offers=S.offers.filter(function(o){return !o.sample});S.reels=S.reels.filter(function(r){return !r.sample});save();toast('Demo hata diye');renderAdmin();return}
  if(x=t.closest('[data-delr]')){var rid=x.getAttribute('data-delr');arm('r'+rid,function(){S.reviews=S.reviews.filter(function(r){return r.id!==rid});save();toast('Review delete ho gaya')});return}
  if(x=t.closest('[data-togo]')){var of=S.offers.filter(function(o){return o.id===x.getAttribute('data-togo')})[0];if(of){of.active=!of.active;save();renderAdmin()}return}
  if(x=t.closest('[data-delo]')){var oid=x.getAttribute('data-delo');arm('o'+oid,function(){S.offers=S.offers.filter(function(o){return o.id!==oid});save()});return}
  if(x=t.closest('[data-delreel]')){var vid=x.getAttribute('data-delreel');arm('v'+vid,function(){S.reels=S.reels.filter(function(r){return r.id!==vid});save()});return}
  if(x=t.closest('[data-delcat]')){var i=Number(x.getAttribute('data-delcat')),c=S.categories[i];if(S.products.some(function(p){return p.cat===c})){toast('Is category mein products hain. Pehle unhe doosri category mein daalein.');return}S.categories.splice(i,1);save();renderAdmin();return}
  if(x=t.closest('[data-col]')){S.accent=x.getAttribute('data-col');save();applyTheme();renderAdmin();return}
  if(t.closest('[data-rmlogo]')){S.logo='';save();renderAdmin();return}
  if(t.closest('[data-copybk]')){var ta=$('#bk-out');ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){toast('Copy ho gaya')},function(){toast('Text select ho gaya, ab copy karein')})}catch(err){toast('Text select ho gaya, ab copy karein')}return}
  if(t.closest('[data-restore]')){try{var d=JSON.parse($('#bk-in').value);if(!d||!d.settings||!d.products)throw 0;S=Object.assign(clone(DEF),d);S.settings=Object.assign({},DEF.settings,d.settings);save();applyTheme();toast('Backup wapas lag gaya');renderAdmin()}catch(err){toast('Ye sahi backup nahi lag raha. Poora data copy karke paste karein.')}return}
  if(t.closest('[data-reset]')){arm('reset',function(){S=clone(DEF);save();applyTheme();toast('Demo data wapas aa gaya')});return}
});
document.addEventListener('input',function(e){
  if(route()!=='admin')return;var el=e.target,k=el.getAttribute('data-d');
  if(k){draft[k]=el.value;return}
  if(el.id==='c-text')adm.cancelText=el.value;
});
document.addEventListener('change',function(e){
  if(route()!=='admin')return;var el=e.target;
  if(el.getAttribute('data-d')){draft[el.getAttribute('data-d')]=el.value}
  if(el.id==='c-reason')adm.cancelReason=el.value;
  if(el.id==='p-img')readImage(el.files[0],800,'image/jpeg',.74,function(d){draft.img=d;renderAdmin()});
  if(el.id==='r-img')readImage(el.files[0],500,'image/jpeg',.72,function(d){rdraft.title=$('#r-title').value;rdraft.link=$('#r-link').value;rdraft.img=d;renderAdmin()});
  if(el.id==='logo-file')readImage(el.files[0],320,'image/png',1,function(d){S.logo=d;if(save()){toast('Logo lag gaya');renderAdmin()}});
  if(el.id==='col-custom'){S.accent=el.value;save();applyTheme();renderAdmin()}
});
document.addEventListener('submit',function(e){
  if(route()!=='admin')return;var id=e.target.id;
  if(id==='loginform'){e.preventDefault();if($('#pin').value===S.pin){authed=true;renderAdmin()}else toast('PIN galat hai');return}
  if(id==='pform'){e.preventDefault();var cur=prod(editing),isNew=!cur,p=cur||{id:uid('p'),soldout:false,featured:false,sample:false};
    p.name=(draft.name||'').trim();p.nameHi=(draft.nameHi||'').trim();p.cat=draft.cat;p.price=Number(draft.price)||0;p.old=Number(draft.old)||0;p.badge=draft.badge||'';p.stock=(draft.stock===''||draft.stock==null)?'':Number(draft.stock);
    p.sizes=String(draft.sizes||'').split(',').map(function(z){return z.trim()}).filter(Boolean);p.desc=(draft.desc||'').trim();p.descHi=(draft.descHi||'').trim();p.img=draft.img||'';
    if(isNew)S.products.unshift(p);
    if(save()){toast(isNew?'Product jud gaya':'Badlav save ho gaya');editing=null;renderAdmin()}else if(isNew)S.products.shift();return}
  if(id==='oform'){e.preventDefault();S.offers.unshift({id:uid('o'),title:$('#o-title').value.trim(),titleHi:$('#o-titleHi').value.trim(),text:$('#o-text').value.trim(),textHi:$('#o-textHi').value.trim(),code:$('#o-code').value.trim(),percent:Number($('#o-percent').value)||0,till:$('#o-till').value.trim(),active:true,sample:false});save();toast('Offer jud gaya');renderAdmin();return}
  if(id==='rform'){e.preventDefault();S.reels.push({id:uid('r'),title:$('#r-title').value.trim(),link:$('#r-link').value.trim(),img:rdraft.img||'',sample:false});rdraft={title:'',link:'',img:''};save();toast('Reel jud gayi');renderAdmin();return}
  if(id==='iform'){e.preventDefault();var s=S.settings,v=function(i){return $(i).value.trim()};
    s.name=v('#i-name')||s.name;s.phone=v('#i-phone');s.whatsapp=$('#i-wa').value.replace(/\D/g,'');s.instagram=v('#i-insta');s.maps=v('#i-maps');s.hours=v('#i-hours');s.tagline=v('#i-tag');s.address=v('#i-addr');s.announce=v('#i-ann');s.about=v('#i-about');
    s.upi=v('#i-upi');s.upiName=v('#i-upiname');s.deliveryFee=Number($('#i-fee').value)||0;s.freeAbove=Number($('#i-free').value)||0;s.returnDays=Number($('#i-rdays').value)||0;s.deliveryDays=v('#i-ddays');s.area=v('#i-area');s.codOn=$('#i-cod').checked;
    save();toast('Jaankari save ho gayi');renderAdmin();return}
  if(id==='cform'){e.preventDefault();var cv=$('#c-new').value.trim();if(cv&&S.categories.indexOf(cv)<0){S.categories.push(cv);save();renderAdmin()}return}
  if(id==='pinform'){e.preventDefault();var n=$('#pin-new').value.trim();if(n.length<4){toast('PIN kam se kam 4 ank ka rakhein');return}S.pin=n;S.pinChanged=true;save();toast('PIN badal gaya');renderAdmin()}
});
/* ---------- start ---------- */
applyTheme();
document.documentElement.setAttribute('data-lang',cust.lang);document.documentElement.lang=cust.lang;
window.addEventListener('hashchange',function(){if(route()!==curRoute)go()});
go();
})();
</script>
